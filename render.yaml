# Sonic GameWorld OS — Render Blueprint
#
# Deploys: the API, one combined workers background service (WORKER=all), and all 6 Next.js web
# apps, plus a managed Postgres and a managed Redis (Key Value) instance. All application services
# build from Dockerfiles under infrastructure/docker/ (see that directory's README for what each
# one does) — build from the repo root context so `turbo prune` can see the whole monorepo.
#
# NOTE ON PROVIDER SCHEMA DRIFT: this file was written against Render's Blueprint spec
# (https://render.com/docs/blueprint-spec) from this assignment's training knowledge, not a live
# fetch of Render's current docs (unavailable in this build environment) — before the first real
# `render blueprint launch`, diff the field names below (especially `runtime:`, `dockerBuildArgs:`,
# and the Redis `type:`) against Render's current docs, since managed-platform Blueprint schemas
# do evolve. Everything else (service topology, env var names/values, health check paths) is
# derived directly from this repo's actual code (services/api/src/config.ts, docker-compose.yml,
# CONTRACTS.md) and should not need adjustment.
#
# `dockerBuildArgs` values are static strings — Render cannot resolve `fromService`/`fromDatabase`
# at Docker build time (those only work for runtime `envVars`), so the NEXT_PUBLIC_* values below
# are the intended production custom domains. Point them at your real domains (or each service's
# `onrender.com` URL, if you haven't set up custom domains yet) before deploying.

databases:
  - name: gameworld-postgres
    databaseName: gameworld
    user: gameworld
    plan: standard
    region: ohio
    postgresMajorVersion: "16"
    # Render's managed Postgres supports the `postgis` and `vector` extensions used by
    # WorldRegion.geom / SearchDocument.embedding (CONTRACTS.md §10) — `CREATE EXTENSION` runs as
    # part of services/api's own Prisma migrations, not here.

envVarGroups:
  # NOTE: services/api (src/config.ts) and workers/* (each worker's own src/env.ts) read
  # DIFFERENT env var names for the same S3-compatible storage config — services/api reads
  # S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY/S3_PUBLIC_URL_BASE, every worker reads
  # S3_ACCESS_KEY/S3_SECRET_KEY/CDN_BASE_URL (matching the root .env.example's naming instead).
  # This is a genuine naming mismatch between those two packages, not a typo here — both groups
  # below set BOTH names to the same value so every service resolves correctly regardless of
  # which convention its own code happens to read. See the root README's cross-package notes.
  - name: gameworld-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: JWT_ISSUER
        value: sonic-gameworld
      - key: EVENT_BUS_DRIVER
        value: redis
      - key: AI_PROVIDER
        value: anthropic
      - key: AI_MODEL_DEFAULT
        value: claude-sonnet-4-5
      - key: AI_EMBEDDING_MODEL
        value: text-embedding-004
      - key: S3_REGION
        value: us-east-1
      - key: S3_BUCKET
        value: gameworld-assets-prod
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: S3_PUBLIC_URL_BASE          # read by services/api
        value: https://cdn.sonicgameworld.com
      - key: CDN_BASE_URL                # read by workers/* — same value, different var name (see note above)
        value: https://cdn.sonicgameworld.com

  - name: gameworld-secrets
    envVars:
      # `sync: false` — Render Blueprints never store secret values in this file; set each of
      # these once in the Render Dashboard (Environment Groups > gameworld-secrets) after the
      # first blueprint sync. See integrations/stripe, integrations/identity, integrations/storage
      # for how to obtain each one.
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CONNECT_CLIENT_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: S3_ACCESS_KEY_ID            # read by services/api
        sync: false
      - key: S3_SECRET_ACCESS_KEY        # read by services/api
        sync: false
      - key: S3_ACCESS_KEY               # read by workers/* — same credential, different var name
        sync: false
      - key: S3_SECRET_KEY               # read by workers/* — same credential, different var name
        sync: false
      - key: MAPTILER_KEY
        sync: false
      - key: OPENTOPO_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

services:
  # ---- Redis (BullMQ queues, ioredis cache, `redis` event bus driver) ----
  - type: redis
    name: gameworld-redis
    plan: standard
    region: ohio
    ipAllowList: []
    maxmemoryPolicy: noeviction

  # ---- API (services/api — one modular Fastify service, all domains) ----
  - type: web
    name: gameworld-api
    runtime: docker
    dockerfilePath: ./infrastructure/docker/api.Dockerfile
    dockerContext: .
    plan: standard
    region: ohio
    healthCheckPath: /v1/health
    # Runs `prisma migrate deploy` against the current release before traffic is cut over to it —
    # keeps schema migrations out of the image's CMD (see infrastructure/docker/README.md). The
    # CLI binary lives under services/api's own node_modules (pnpm's non-hoisted layout), which is
    # why api.Dockerfile deliberately keeps devDependencies in the final image.
    preDeployCommand: services/api/node_modules/.bin/prisma migrate deploy --schema services/api/prisma/schema.prisma
    envVars:
      - fromGroup: gameworld-shared
      - fromGroup: gameworld-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: gameworld-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: gameworld-redis
          property: connectionString
      # services/api/src/config.ts reads API_PORT, not the platform-standard PORT — Render's
      # Docker port auto-detection falls back to api.Dockerfile's `EXPOSE 4000` when no PORT
      # env var is set, so this is deliberately left unset rather than introducing a second,
      # unread PORT var (see infrastructure/docker/api.Dockerfile's comment on this).
      - key: API_PORT
        value: "4000"
      # config.baseUrl (API_BASE_URL) is used to build Stripe Checkout success/cancel redirect
      # URLs (services/api/src/modules/payments/index.ts) — those are marketplace app routes
      # (`/checkout/success`, `/checkout/cancel`), not the API's own URL, despite the var's name.
      - key: API_BASE_URL
        value: https://marketplace.sonicgameworld.com

  # ---- Workers (all 6 BullMQ queues combined in one background service; WORKER=all) ----
  - type: worker
    name: gameworld-workers
    runtime: docker
    dockerfilePath: ./infrastructure/docker/workers.Dockerfile
    dockerContext: .
    plan: standard
    region: ohio
    envVars:
      - fromGroup: gameworld-shared
      - fromGroup: gameworld-secrets
      - key: WORKER
        value: all
      - key: DATABASE_URL
        fromDatabase:
          name: gameworld-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: gameworld-redis
          property: connectionString

  # ---- Web apps (Next.js 15, one Docker build per app via the APP build arg) ----
  - type: web
    name: gameworld-studio
    runtime: docker
    dockerfilePath: ./infrastructure/docker/web.Dockerfile
    dockerContext: .
    plan: standard
    region: ohio
    dockerBuildArgs:
      APP: studio
      APP_PORT: "3000"
      NEXT_PUBLIC_API_URL: https://api.sonicgameworld.com
      NEXT_PUBLIC_WS_URL: wss://api.sonicgameworld.com
      NEXT_PUBLIC_CDN_BASE_URL: https://cdn.sonicgameworld.com
    envVars:
      - key: PORT
        value: "3000"

  - type: web
    name: gameworld-marketplace
    runtime: docker
    dockerfilePath: ./infrastructure/docker/web.Dockerfile
    dockerContext: .
    plan: standard
    region: ohio
    dockerBuildArgs:
      APP: marketplace
      APP_PORT: "3001"
      NEXT_PUBLIC_API_URL: https://api.sonicgameworld.com
      NEXT_PUBLIC_WS_URL: wss://api.sonicgameworld.com
      NEXT_PUBLIC_CDN_BASE_URL: https://cdn.sonicgameworld.com
    envVars:
      - key: PORT
        value: "3001"

  - type: web
    name: gameworld-player
    runtime: docker
    dockerfilePath: ./infrastructure/docker/web.Dockerfile
    dockerContext: .
    plan: standard
    region: ohio
    dockerBuildArgs:
      APP: player
      APP_PORT: "3002"
      NEXT_PUBLIC_API_URL: https://api.sonicgameworld.com
      NEXT_PUBLIC_WS_URL: wss://api.sonicgameworld.com
      NEXT_PUBLIC_CDN_BASE_URL: https://cdn.sonicgameworld.com
    envVars:
      - key: PORT
        value: "3002"

  - type: web
    name: gameworld-creator
    runtime: docker
    dockerfilePath: ./infrastructure/docker/web.Dockerfile
    dockerContext: .
    plan: standard
    region: ohio
    dockerBuildArgs:
      APP: creator
      APP_PORT: "3003"
      NEXT_PUBLIC_API_URL: https://api.sonicgameworld.com
      NEXT_PUBLIC_WS_URL: wss://api.sonicgameworld.com
      NEXT_PUBLIC_CDN_BASE_URL: https://cdn.sonicgameworld.com
    envVars:
      - key: PORT
        value: "3003"

  - type: web
    name: gameworld-admin
    runtime: docker
    dockerfilePath: ./infrastructure/docker/web.Dockerfile
    dockerContext: .
    plan: standard
    region: ohio
    dockerBuildArgs:
      APP: admin
      APP_PORT: "3004"
      NEXT_PUBLIC_API_URL: https://api.sonicgameworld.com
      NEXT_PUBLIC_WS_URL: wss://api.sonicgameworld.com
      NEXT_PUBLIC_CDN_BASE_URL: https://cdn.sonicgameworld.com
    envVars:
      - key: PORT
        value: "3004"

  - type: web
    name: gameworld-developer-portal
    runtime: docker
    dockerfilePath: ./infrastructure/docker/web.Dockerfile
    dockerContext: .
    plan: standard
    region: ohio
    dockerBuildArgs:
      APP: developer-portal
      APP_PORT: "3005"
      NEXT_PUBLIC_API_URL: https://api.sonicgameworld.com
      NEXT_PUBLIC_WS_URL: wss://api.sonicgameworld.com
      NEXT_PUBLIC_CDN_BASE_URL: https://cdn.sonicgameworld.com
    envVars:
      - key: PORT
        value: "3005"
